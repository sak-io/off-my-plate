# Apple platforms: Core must also build and pass its tests with Apple's toolchain.
# T01 scope: `swift test` for Packages/Core. T02 extends this job with XcodeGen,
# Packages/Apple and `xcodebuild test` on iPhone and iPad simulators (plan section 9).
#
# Xcode: the newest stable Xcode 26.x installed on the macos-15 runner image (Swift 6.2,
# matching core-linux.yml). If the image has no Xcode 26, the runner default is used and
# the version is printed; Package.swift needs Swift tools 6.0 or later.
name: apple-macos

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core-macos:
    name: Core (macOS 15, Xcode 26)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|_rc|release_candidate' | sort -V | tail -n 1 || true)"
          if [[ -n "$xcode" ]]; then
            sudo xcode-select --switch "$xcode/Contents/Developer"
          else
            echo "::warning::No stable Xcode 26 on this runner image; using the default Xcode."
          fi
          xcodebuild -version
          swift --version

      - name: Test Core
        run: swift test --package-path Packages/Core
