# Apple platforms (plan section 9): everything that needs macOS and Xcode.
#   Three jobs run in PARALLEL so wall time is the slowest one, not the sum, and one failure
#   does not hide the others:
#   1. swift test for Packages/Core (Apple toolchain) and Packages/Apple (OMPData, ...),
#      each with the zero-test guard (scripts/assert-tests-ran.sh);
#   2. XcodeGen generates App/OffMyPlate.xcodeproj from App/project.yml (ADR 0006);
#   3. xcodebuild test (app build, share extension, UI tests) on an iPhone 16 and an iPad
#      simulator, each with the zero-test guard (scripts/assert-xcresult-tests-ran.sh).
# Simulator builds are unsigned (CODE_SIGNING_ALLOWED=NO); no signing material in CI.
#
# Xcode: the newest stable Xcode 26.x installed on the macos-15 runner image (Swift 6.2,
# matching core-linux.yml and the owner's Xcode). The job FAILS if the image has no stable
# Xcode 26, rather than silently testing with an older toolchain.
name: apple-macos

# Pushes: the session/agent branches and main. Local feat/* task branches are never pushed.
on:
  push:
    branches: ["claude/**", "main"]
    # Docs-only and team-bookkeeping pushes do not need a build (saves macOS minutes). If the last
    # commit on a branch is docs-only it gets no run of its own; the previous code commit's run applies.
    paths-ignore: ["docs/**", ".autocraft/**", "work/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; branch pushes always run to completion so
# every commit on claude/** and main keeps a result (handoffs cite them).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  swift-tests:
    name: Swift packages (macOS 15, Xcode 26)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (the v4 tag; pinned by commit SHA)
        with:
          persist-credentials: false

      - uses: ./.github/actions/apple-setup
        with:
          generate-project: "false"

      - name: Test Core (fails if no Swift Testing test ran)
        run: |
          swift test --package-path Packages/Core 2>&1 | tee "$RUNNER_TEMP/core-tests.log"
          scripts/assert-tests-ran.sh "$RUNNER_TEMP/core-tests.log"

      - name: Test Packages/Apple (fails if no Swift Testing test ran)
        run: |
          swift test --package-path Packages/Apple 2>&1 | tee "$RUNNER_TEMP/apple-tests.log"
          scripts/assert-tests-ran.sh "$RUNNER_TEMP/apple-tests.log"

      - name: Self-test the CI helper scripts (python3 required here)
        env:
          OMP_REQUIRE_PYTHON: "1"
        run: |
          scripts/tests/test-select-simulator.sh
          scripts/tests/test-assert-xcresult-tests-ran.sh

  ui-iphone:
    name: UI tests iPhone (macOS 15, Xcode 26)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (the v4 tag; pinned by commit SHA)
        with:
          persist-credentials: false

      - uses: ./.github/actions/apple-setup

      - name: Pick simulator (newest iOS 18+ runtime; no hardcoded OS versions)
        run: |
          xcrun simctl list runtimes
          echo "SIM_UDID=$(scripts/select-simulator.sh iphone "iPhone 16")" >> "$GITHUB_ENV"

      - name: Build and UI-test (fails if no test ran)
        run: |
          bundle="$RUNNER_TEMP/ui-iphone.xcresult"
          xcodebuild test \
            -project App/OffMyPlate.xcodeproj \
            -scheme OffMyPlate \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$bundle" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
          scripts/assert-xcresult-tests-ran.sh "$bundle"

  ui-ipad:
    name: UI tests iPad (macOS 15, Xcode 26)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (the v4 tag; pinned by commit SHA)
        with:
          persist-credentials: false

      - uses: ./.github/actions/apple-setup

      - name: Pick simulator (newest iOS 18+ runtime; no hardcoded OS versions)
        run: |
          xcrun simctl list runtimes
          echo "SIM_UDID=$(scripts/select-simulator.sh ipad "iPad (A16)")" >> "$GITHUB_ENV"

      - name: Build and UI-test (fails if no test ran)
        run: |
          bundle="$RUNNER_TEMP/ui-ipad.xcresult"
          xcodebuild test \
            -project App/OffMyPlate.xcodeproj \
            -scheme OffMyPlate \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$bundle" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
          scripts/assert-xcresult-tests-ran.sh "$bundle"
