# Core on Linux: the verification of record for Packages/Core (plan section 9, ADR 0005).
# Runs lint self-tests, all lints, then builds and tests the Core package with the
# official Swift 6.2 image (matches the owner's Xcode 26 toolchain).
name: core-linux

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  core:
    name: Core (Linux, Swift 6.2)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: swift --version

      - name: Lints (self-tests on planted violations, then the repository)
        run: scripts/check-core.sh --lint-only

      - name: Build Core (including tests)
        run: swift build --package-path Packages/Core --build-tests

      - name: Test Core
        run: swift test --package-path Packages/Core --skip-build
