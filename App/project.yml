# OffMyPlate Xcode project, generated by XcodeGen (ADR 0006). The .xcodeproj is git-ignored:
#   cd App && xcodegen generate
# XcodeGen version: App/.xcodegen-version. Signing team and ID overrides: Config/Local.xcconfig
# (copy Config/Local.xcconfig.example). Only local packages: zero third-party packages
# (ADR 0002); scripts/lint-no-network.sh fails on any remote package in this file.
name: OffMyPlate

options:
  minimumXcodeGenVersion: "2.42.0"
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

packages:
  Core:
    path: ../Packages/Core
  Apple:
    path: ../Packages/Apple

targets:
  # The app: composition root and navigation only (ADR 0004). Universal, iOS/iPadOS 18.
  OffMyPlate:
    type: application
    platform: iOS
    sources:
      - path: OffMyPlate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMP_BUNDLE_ID_PREFIX).OffMyPlate"
        PRODUCT_NAME: OffMyPlate
        INFOPLIST_FILE: OffMyPlate/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: OffMyPlate/OffMyPlate.entitlements
    dependencies:
      - target: OffMyPlateShare
      - package: Core
        products:
          - OMPDomain
          - OMPServices
      - package: Apple
        products:
          - OMPFeatures
          - OMPData
    scheme:
      testTargets:
        - OffMyPlateUITests

  # Share extension (ADR 0011): links only OMPDomain, OMPRecipes and OMPUI, never
  # OMPServices or OMPData, so it can never reach planning, approval or the store.
  OffMyPlateShare:
    type: app-extension
    platform: iOS
    sources:
      - path: OffMyPlateShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMP_BUNDLE_ID_PREFIX).OffMyPlate.Share"
        PRODUCT_NAME: OffMyPlateShare
        INFOPLIST_FILE: OffMyPlateShare/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: OffMyPlateShare/OffMyPlateShare.entitlements
    dependencies:
      - package: Core
        products:
          - OMPDomain
          - OMPRecipes
      - package: Apple
        product: OMPUI

  OffMyPlateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OffMyPlateUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(OMP_BUNDLE_ID_PREFIX).OffMyPlateUITests"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: OffMyPlate
